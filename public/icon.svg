<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060813" />
      <stop offset="100%" stop-color="#0F162F" />
    </linearGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#742CFF" />
      <stop offset="100%" stop-color="#08D9FF" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Cyberpunk Base -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />
  <rect width="500" height="500" x="6" y="6" rx="104" fill="none" stroke="url(#neonGrad)" stroke-width="8" opacity="0.8" />

  <!-- Lightning Bolt / Zap Neon Logo -->
  <path d="M280 80 L140 280 L250 280 L230 432 L372 232 L262 232 Z" 
        fill="url(#neonGrad)" 
        filter="url(#neonGlow)" />

  <!-- TapNova Text Accent -->
  <text x="256" y="475" text-anchor="middle" font-family="'Outfit', sans-serif" font-weight="900" font-size="34" fill="#08D9FF" letter-spacing="4">TAPNOVA</text>
</svg>
